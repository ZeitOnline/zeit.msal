[project]
name = "zeit.msal"
description = "Microsoft Azure AD authentication helper for CLI applications"
authors = [{ name = "Die ZEIT Online Engineering", email = "zon-backend@zeit.de" }]
dynamic = ["readme", "version"]
dependencies = [
    "click",
    "msal",
]

[project.scripts]
msal-token = "zeit.msal.cli:cli"

[project.urls]
Repository = "https://github.com/ZeitOnline/zeit.msal"
Changelog = "https://github.com/ZeitOnline/zeit.msal/blob/main/CHANGES.md"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path="README.md"}, {text="\n\n"}, {path="CHANGES.md"}]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    # "UP", # pyupgrade
    # "B", # flake8-bugbear
    # "SIM", # flake8-simplify
    "I", # isort
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
