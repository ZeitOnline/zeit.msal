[project]
name = "zeit.msal"
version = '1.4.0.dev0'
description = "Microsoft Azure AD authentication helper for CLI applications"
authors = [{ name = "Die ZEIT Online Engineering", email = "zon-backend@zeit.de" }]
dynamic = ["readme"]
dependencies = [
    "click",
    "msal",
]

[dependency-groups]
release = ["towncrier"]

[project.scripts]
msal-token = "zeit.msal.cli:cli"

[project.urls]
Repository = "https://github.com/ZeitOnline/zeit.msal"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/bin", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [{path="README.rst"}, {text="\n\n"}, {path="CHANGES.rst"}]

[tool.towncrier]
directory = "docs/changelog/"
filename = "CHANGES.rst"
title_format = ""
# First underline is used for version/date header.
# Second underline is used for the type names (like 'Bug fixes:').
underlines = ["-", "+"]
[[tool.towncrier.type]]
directory = "change"
name = "Changes"  # I'd love to omit the category, but that requires copy&paste of the whole template
showcontent = true


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    # "UP", # pyupgrade
    # "B", # flake8-bugbear
    # "SIM", # flake8-simplify
    "I", # isort
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
